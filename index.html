<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaime Tjahaja</title>
<meta name="description" content="Jaime Tjahaja — songwriter, multi-instrumentalist, and cook. Bay Area.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="landing">

  <header class="landing-header">
    <h1>Jaime Tjahaja</h1>
  </header>

  <main class="split">
    <a class="split-panel music-panel" href="music/index.html">
      <img class="panel-bg" src="images/music/live-hero.jpg" alt="Jaime Tjahaja performing live">
      <div class="panel-scrim"></div>
      <div class="panel-label">
        <span class="panel-eyebrow">Listen</span>
        <span class="panel-title">Music</span>
        <span class="panel-arrow">Enter &rarr;</span>
      </div>

    <a class="split-panel culinary-panel" href="culinary/index.html">
      <img class="panel-bg" src="images/culinary/fire-cook.jpg" alt="Jaime cooking over an open fire">
      <div class="panel-scrim"></div>
      <div class="panel-label">
        <span class="panel-eyebrow">Taste</span>
        <span class="panel-title">Culinary</span>
        <span class="panel-arrow">Enter &rarr;</span>
      </div>
    </a>

    <div class="panel-divider"></div>
  </main>

  <footer class="landing-footer">
    <span>&copy; 2026 Jaime Tjahaja</span>
  </footer>
